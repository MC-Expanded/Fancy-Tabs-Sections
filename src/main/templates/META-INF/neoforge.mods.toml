modLoader="javafml" #mandatory

loaderVersion="[2,]" #mandatory

license="MIT"

issueTrackerURL="https://github.com/MC-Expanded/Fancy-Tabs-Neo/issues" #optional

[[mods]] #mandatory
modId="fancytabsections"
version="${mod_version}"
displayName="${mod_name}"
displayURL="http://curseforge.com/minecraft/mc-mods/fancy-tab-sections"
logoFile = "icon.png"
mod_authors="wdiscute, Kaupenjoe, nanoattack, NicciCage, SockyWocky7"
description='''
A library to allow for easy control of Sections inside Creative Mode Tabs
'''

[[mixins]]
config="fancytabsections.mixins.json"


[[dependencies.fancytabsections]] #optional
modId="neoforge" #mandatory
type="required" #mandatory
versionRange="${neo_version_range}" #mandatory
ordering="AFTER"
side="BOTH"

[[dependencies.fancytabsections]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"